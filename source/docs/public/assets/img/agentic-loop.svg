<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" width="920" height="240" role="img" aria-label="Agentic loop: brief, generate, review, deploy">
  <defs>
    <linearGradient id="loopGrad" x1="0" y1="0" x2="920" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#0ea5e9"/>
    </marker>
  </defs>
  <style>
    .step-box { fill: rgba(0,113,227,0.06); stroke: #0ea5e9; stroke-width: 1.5; }
    .step-num { font: 700 15px -apple-system, 'Segoe UI', sans-serif; fill: #0071e3; }
    .step-label { font: 600 16px -apple-system, 'Segoe UI', sans-serif; fill: #1d1d1f; }
    .step-sub { font: 400 12.5px -apple-system, 'Segoe UI', sans-serif; fill: #6e6e73; }
    .arrow-line { stroke: url(#loopGrad); stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    @media (prefers-color-scheme: dark) {
      .step-label { fill: #f5f5f7; }
      .step-sub { fill: #a1a1a6; }
      .step-num { fill: #2997ff; }
      .step-box { fill: rgba(14,165,233,0.10); }
    }
  </style>

  <g>
    <rect class="step-box" x="20" y="70" width="190" height="100" rx="18"/>
    <text class="step-num" x="42" y="102">01</text>
    <text class="step-label" x="42" y="128">Brief the agents</text>
    <text class="step-sub" x="42" y="150">Specs, edge cases,</text>
    <text class="step-sub" x="42" y="166">acceptance criteria</text>
  </g>
  <path class="arrow-line" d="M215 120 H 255"/>

  <g>
    <rect class="step-box" x="262" y="70" width="190" height="100" rx="18"/>
    <text class="step-num" x="284" y="102">02</text>
    <text class="step-label" x="284" y="128">Generate &amp; iterate</text>
    <text class="step-sub" x="284" y="150">Agents implement</text>
    <text class="step-sub" x="284" y="166">in parallel</text>
  </g>
  <path class="arrow-line" d="M457 120 H 497"/>

  <g>
    <rect class="step-box" x="504" y="70" width="190" height="100" rx="18"/>
    <text class="step-num" x="526" y="102">03</text>
    <text class="step-label" x="526" y="128">Human review</text>
    <text class="step-sub" x="526" y="150">Security, architecture,</text>
    <text class="step-sub" x="526" y="166">edge cases</text>
  </g>
  <path class="arrow-line" d="M699 120 H 739"/>

  <g>
    <rect class="step-box" x="746" y="70" width="154" height="100" rx="18"/>
    <text class="step-num" x="768" y="102">04</text>
    <text class="step-label" x="768" y="128">Deploy</text>
    <text class="step-sub" x="768" y="150">Ship to the edge,</text>
    <text class="step-sub" x="768" y="166">watch metrics</text>
  </g>

  <path class="arrow-line" d="M823 172 C 823 218, 115 218, 115 174"/>
</svg>
